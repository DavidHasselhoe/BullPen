name: Cron — Academy Daily Challenge Reminder

# Daily at 01:00 UTC (~9pm EDT / 8pm EST) — an evening nudge for users with
# an active Academy streak who haven't done anything in Academy yet today,
# while there's still time left in their ET day to keep the streak alive.
# Time-tolerant (a reminder landing a few minutes late is fine), so this runs
# on GitHub Actions rather than Vercel's 2-cron Hobby-plan cap — same
# reasoning as cron-check-earnings-upcoming.yml.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:  # allows manual fire from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/cron/check-daily-challenge-reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/check-daily-challenge-reminder"
