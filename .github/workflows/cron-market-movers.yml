name: Cron — Instagram Market Movers

# Monday, Wednesday, Friday at 21:30 UTC (post US market close) — same
# time-of-day as check-price-moves, chosen for the same reason (reliably
# after close in both EDT/EST; nothing in this codebase hardcodes a fixed
# UTC close time). 3x/week rather than every weekday: a same-format post
# every single weekday risked feed fatigue given the existing 2x/week
# earnings content already posts on top of this.
# Generates + stages that day's top-10-gainers/top-10-losers carousel
# (S&P 500 + Nasdaq 100 only) and posts a Discord preview for review — it
# does NOT publish to Instagram itself (see scripts/publish-instagram.ts
# for that manual step).
on:
  schedule:
    - cron: '30 21 * * 1,3,5'
  workflow_dispatch:  # allows manual fire from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/market-movers-daily
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/market-movers-daily"
