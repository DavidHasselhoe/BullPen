name: Cron — Check Price Moves

# Weekdays at 21:30 UTC (post US market close). Detects 5%+ moves on
# tracked stocks and creates digest notifications.
# Was a Vercel cron, moved here to fit within Hobby plan's 2-cron limit.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/check-price-moves
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/check-price-moves"
