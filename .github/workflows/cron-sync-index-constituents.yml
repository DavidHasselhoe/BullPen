name: Cron — Sync Index Constituents

# Monday 05:00 UTC, ahead of market open and the other Monday-morning crons.
# Refreshes lib/market-data/sp500.ts, nasdaq100.ts and dow30.ts against real index
# membership (SPY's daily holdings disclosure for the S&P 500, Nasdaq's own
# API for the Nasdaq-100 — see lib/market-data/index-sync.ts). Both sources
# are official/fund-mandated, so a genuine diff is committed straight to
# preview, no manual review gate — see scripts/sync-index-constituents.ts's
# header for the reasoning. A Discord notification fires only when something
# actually changed, matching the "no news is fine, don't spam" pattern used
# by the other content crons in this repo.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: preview

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Sync index constituents
        env:
          DISCORD_INDEX_SYNC_WEBHOOK_URL: ${{ secrets.DISCORD_INDEX_SYNC_WEBHOOK_URL }}
          INDEX_CHANGES_FILE: ${{ runner.temp }}/index-changes.json
        run: npm run sync-index-constituents

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- lib/market-data/sp500.ts lib/market-data/nasdaq100.ts lib/market-data/dow30.ts; then
            echo "No index membership changes this week."
            exit 0
          fi
          git config user.name "bullpen-bot"
          git config user.email "actions@github.com"
          git add lib/market-data/sp500.ts lib/market-data/nasdaq100.ts lib/market-data/dow30.ts
          git commit -m "chore: sync S&P 500 / Nasdaq 100 constituents" \
            -m "Automated weekly sync against SPY holdings + Nasdaq's official API. See scripts/sync-index-constituents.ts."
          git push origin HEAD:preview

      # After the commit, so a failed push records nothing it will re-detect next
      # week. Fail-soft: a failed POST loses that week's events and notifications,
      # but never blocks the constituent files from syncing.
      - name: Record changes and weights in the app
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpeninvest.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not configured, index changes not recorded"
            exit 0
          fi
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data @"${RUNNER_TEMP}/index-changes.json" \
            "${APP_URL}/api/cron/record-index-changes" \
            || echo "::warning::recording index changes failed; this week's events and notifications are lost"
