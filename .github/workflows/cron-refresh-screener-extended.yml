name: Cron — Refresh Screener (Extended)

# Daily at 03:00 UTC. Complements the 22:00 "Refresh Screener Financial Data"
# job, which covers roughly the first half (A-Z) of the active universe (batches
# 0–121, ~610 names at the current 5-symbol batch size). This job:
#   1. Refreshes the rest of the active universe, starting at batch 122.
#      The upper bound (400) is a generous ceiling, not the real stop
#      condition — the loop breaks as soon as the API reports `done: true`
#      (batch index past the end of the active universe). A previous version
#      hardcoded the ceiling to the universe size at the time (batch 115 at a
#      10-symbol batch size, ~1160 tickers); the active universe silently
#      grew past that seam (1219 tickers as of 2026-08) and the tail of the
#      universe stopped getting refreshed with nothing announcing it. Letting
#      `done` drive termination means this can't go stale again the same way
#      — the 400 ceiling just needs to stay ahead of real universe growth.
# The tier-0 discovery sweep used to be a second step here. It has its own
# workflow now (cron-refresh-screener-discovery.yml) at 01:00 UTC,
# so its longer run can't push this job past its timeout.
# Each batch = 5 stocks × up to 53 credits, paced 65s apart to stay under the
# TwelveData 610 credits/min limit (halved from the original 10-stock batch —
# see lib/twelvedata/credit-budget.ts for why).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  refresh-extended:
    runs-on: ubuntu-latest
    # Batches start 65s apart (the sleep is what's left of 65s after the
    # request). Sleeping a flat 65s after each ~27s request made a batch ~92s,
    # and the run timed out at both 240 and 350 min (GitHub reports a timeout
    # as "cancelled"), leaving the alphabetical tail unrefreshed.
    # 1,841 tier-1 tickers on 2026-11-11 = ~247 batches here = ~268 min.
    # 350 is just under GitHub's 360-min cap, room for ~75 more batches.
    # Past that, move the 122 seam up into the 22:00 job instead.
    timeout-minutes: 350
    steps:
      - name: Refresh remaining active universe (batch 122 onward, until done)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpeninvest.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Extended active refresh…"
          for batch in $(seq 122 400); do
            echo "→ Active batch $batch"
            START=$SECONDS
            RESPONSE=$(curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/screener/refresh?batch=${batch}") || {
              echo "Batch $batch failed (rate limit or network) — stopping active phase"
              break
            }
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "Active universe fully covered."
              break
            fi
            WAIT=$((65 - (SECONDS - START)))
            sleep $((WAIT > 0 ? WAIT : 0))
          done
