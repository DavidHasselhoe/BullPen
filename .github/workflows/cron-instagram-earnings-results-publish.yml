name: Cron — Instagram Earnings Results Publish

# Sunday 15:00 UTC — a day after cron-instagram-earnings-results stages the
# beat/missed recap carousel (Saturday 14:00 UTC), and after the earnings
# calendar's own generation cron (Sunday 12:00 UTC) so the two don't run
# back-to-back. Publishes whatever is still 'ready' for that period_key,
# same auto-publish pattern as cron-instagram-earnings-publish.
on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:  # allows manual fire from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/instagram-earnings-results-publish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/instagram-earnings-results-publish"
