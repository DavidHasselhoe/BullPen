name: Cron — Check Upcoming Dividends

# Daily at 08:00 UTC. Notifies users about tracked stocks going ex-dividend
# in 3 days. Time-tolerant (a 5–15 min drift is fine for a daily digest), so
# this runs on GitHub Actions rather than Vercel's 2-cron Hobby-plan cap —
# same reasoning as cron-check-earnings-upcoming.yml.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:  # allows manual fire from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/check-dividends-upcoming
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/check-dividends-upcoming"
