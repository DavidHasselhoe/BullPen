name: Cron — Refresh Screener Financial Data

# Daily at 22:00 UTC (after US market close + price-moves cron). Covers
# roughly the first half of the active universe (paged A-Z by ticker); the 03:00 UTC
# "Refresh Screener (Extended)" job picks up from where this one
# leaves off. Chains through batches started 65s apart to stay within
# TwelveData's 610 credits/min rate limit (each batch = 5 stocks × up to 53
# credits — halved from the original 10-stock/530-credit batch so a single
# reservation against the shared credit-budget guard, lib/twelvedata/credit-
# budget.ts, leaves real headroom for organic user traffic in the same
# minute instead of nearly exhausting the 610 cap on its own).
# The loop below is `seq 0 179`: 180 batches × 65s ≈ 195 min (seam moved from
# 121 on 2026-11-17 so the extended job has room for retries). The sleep is
# what's left of 65s after the request, so request latency (~27s) doesn't
# add on top. A previous 70-min timeout killed the job (conclusion
# "cancelled") mid-run every night. 250 min leaves headroom for retries and slow
# individual requests.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  # Vercel starts this workflow on time (app/api/cron/dispatch-workflow).
  # GitHub's own schedule fires 4-10h late and is only the fallback for a
  # missed dispatch: it skips when a dispatch already ran in the last 20 hours.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECENT=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WF=$(basename "${GITHUB_WORKFLOW_REF%@*}")
            SINCE=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            RECENT=$(gh run list -R "$GITHUB_REPOSITORY" -w "$WF" -e workflow_dispatch --created ">=$SINCE" --json databaseId --jq length || echo 0)
          fi
          echo "Dispatched runs in the last 20h: $RECENT"
          echo "run=$([ "$RECENT" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  refresh:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 250
    steps:
      - name: Chain through screener refresh batches (first half of universe)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpeninvest.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting screener refresh…"
          SKIPPED=0; MISSES=0
          for batch in $(seq 0 179); do
            echo "→ Batch $batch"
            START=$SECONDS
            # Retry twice, then skip; stop after 3 skipped batches in a row.
            # (One failure used to end the run as "success".)
            RESPONSE=""
            for attempt in 1 2 3; do
              RESPONSE=$(curl -fsS --max-time 150 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/screener/refresh?batch=${batch}") && break
              RESPONSE=""
              echo "Batch $batch attempt $attempt failed"
              if [ $attempt -lt 3 ]; then sleep 65; fi
            done
            if [ -z "$RESPONSE" ]; then
              SKIPPED=$((SKIPPED + 1)); MISSES=$((MISSES + 1))
              echo "::warning::Batch $batch skipped after 3 attempts"
              if [ $MISSES -ge 3 ]; then
                echo "::error::3 batches in a row failed, stopping at batch $batch"
                exit 1
              fi
              continue
            fi
            MISSES=0
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All batches complete."
              break
            fi
            WAIT=$((65 - (SECONDS - START)))
            sleep $((WAIT > 0 ? WAIT : 0))
          done
          if [ $SKIPPED -gt 0 ]; then
            echo "::error::$SKIPPED batch(es) skipped after retries"
            exit 1
          fi
