name: Cron — Refresh Screener Financial Data

# Daily at 22:00 UTC (after US market close + price-moves cron).
# Chains through all screener batches with 65s delays to stay within
# TwelveData's 610 credits/min rate limit (each batch = 10 stocks × 50 credits).
# The loop below is `seq 0 60` — 61 batches × 65s ≈ 66 min of sleep alone,
# before any request latency. A previous 70-min timeout left almost no
# buffer and the job was getting killed (conclusion "cancelled") mid-run
# every night — confirmed via the Actions API, jobs consistently ran the
# full 70:05 before being cut off. 130 min covers 61 batches with real
# headroom for slow individual requests.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Chain through all screener refresh batches
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting screener refresh…"
          for batch in $(seq 0 60); do
            echo "→ Batch $batch"
            RESPONSE=$(curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/screener/refresh?batch=${batch}") || {
              echo "Batch $batch failed (rate limit or network error) — stopping"
              break
            }
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All batches complete."
              break
            fi
            sleep 65
          done
