name: Cron — Refresh Screener Financial Data

# Daily at 22:00 UTC (after US market close + price-moves cron). Covers
# roughly the first half of the active universe (paged A-Z by ticker); the 03:00 UTC
# "Refresh Screener (Extended)" job picks up from where this one
# leaves off. Chains through batches started 65s apart to stay within
# TwelveData's 610 credits/min rate limit (each batch = 5 stocks × up to 53
# credits — halved from the original 10-stock/530-credit batch so a single
# reservation against the shared credit-budget guard, lib/twelvedata/credit-
# budget.ts, leaves real headroom for organic user traffic in the same
# minute instead of nearly exhausting the 610 cap on its own).
# The loop below is `seq 0 121`: 122 batches × 65s ≈ 132 min. The sleep is
# what's left of 65s after the request, so request latency (~27s) doesn't
# add on top. A previous 70-min timeout killed the job (conclusion
# "cancelled") mid-run every night. 160 min leaves headroom for slow
# individual requests.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - name: Chain through screener refresh batches (first half of universe)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpeninvest.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting screener refresh…"
          for batch in $(seq 0 121); do
            echo "→ Batch $batch"
            START=$SECONDS
            RESPONSE=$(curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/screener/refresh?batch=${batch}") || {
              echo "Batch $batch failed (rate limit or network error) — stopping"
              break
            }
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All batches complete."
              break
            fi
            WAIT=$((65 - (SECONDS - START)))
            sleep $((WAIT > 0 ? WAIT : 0))
          done
