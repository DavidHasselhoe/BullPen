name: Cron — Generate Weekly Pick

# Scheduling moved to Vercel (vercel.json, same "30 6 * * 1" — Mondays 06:30
# UTC / 01:30 ET) so publication happens before pre-market with Vercel's
# tighter timing instead of GitHub's queueing drift, which has been observed
# delaying other crons in this repo by hours, not just the ~5-15 min usually
# assumed. That timing matters here specifically: the published pick is meant
# to be actionable from that session's open, stamped later by
# /api/picks/performance. The route itself also has a same-day guard
# (isPastMarketOpenET) that logs loudly if it ever runs past 9:30 ET, as a
# backstop in case Vercel's own schedule slips.
#
# This workflow is now workflow_dispatch-only — a manual re-run trigger from
# the Actions tab, not a second scheduler. The route is idempotent on the pick
# date, so a manual re-run on the same day is a safe no-op rather than a
# second pick.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /api/cron/generate-weekly-pick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          # Fail loudly: the route deliberately returns 500 when no pick could be
          # published (hallucinated tickers, nothing surviving grounding, a bad
          # model response). A missing week should surface as a red run, not pass
          # silently — that's the signal the pipeline needs attention.
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/generate-weekly-pick"
