name: Cron — Check User Alerts

# Weekdays at :30 past each hour from 14:00–21:00 UTC (market hours).
# Evaluates user-defined price/metric alerts and sends notifications.
# Moved from Vercel crons — Hobby plan only allows once-per-day schedules.
on:
  schedule:
    - cron: '30 14-21 * * 1-5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/check-user-alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/check-user-alerts"
