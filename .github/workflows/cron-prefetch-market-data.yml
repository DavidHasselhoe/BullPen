name: Cron — Prefetch Market Data

# Daily at 05:00 UTC. Pre-caches stats + earnings for all S&P 500 + NASDAQ 100
# tickers (market_data_cache + screener_stats), then financials for whichever
# are still missing them.
#
# Stats+earnings are paced one batch (5 symbols, ~350 credits) every 75s —
# ~107 batches × 75s ≈ 2h15m total — to keep this cron's *sustained* usage
# around ~280 credits/min, well under TwelveData's 610/min plan cap, so live
# user traffic always has headroom during the run instead of getting starved
# by a burst.
#
# Financials (income/balance/cash flow) are NOT cheap despite the endpoint
# names suggesting otherwise: confirmed live against TwelveData's /api_usage
# on 2026-08-04 that each of the three costs ~101 credits regardless of
# outputsize/period (~303/symbol total), not the ~1 credit CLAUDE.md's cost
# table assumes. This used to run as a single unguarded pass over up to 75
# symbols ("~225 credits worst case" per the old comment) which in reality
# could fire ~22,725 credits with zero pacing — the dominant contributor to
# the multi-thousand-credit-per-minute spikes seen on the TwelveData
# dashboard. Now paced one symbol (~303 credits) every 65s, same as stats.
# 150 batches is a generous daily ceiling (steady-state need is ~75-80/day
# once the one-time cold backfill of the full ~530-symbol universe finishes
# rolling forward over a few days); the loop breaks on `done: true` well
# before that whenever there's nothing left to refresh.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Refresh stats + earnings (paced batches)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting stats+earnings prefetch…"
          for batch in $(seq 0 120); do
            echo "→ Batch $batch"
            RESPONSE=$(curl -fsS -X GET -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/prefetch-market-data?phase=stats&batch=${batch}") || {
              echo "Batch $batch failed (rate limit or network error) — stopping"
              break
            }
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All stats batches complete."
              break
            fi
            sleep 75
          done

      - name: Refresh financials (paced batches, one symbol each)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting financials prefetch…"
          for batch in $(seq 0 149); do
            echo "→ Financials batch $batch"
            RESPONSE=$(curl -fsS -X GET -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/prefetch-market-data?phase=financials&batch=${batch}") || {
              echo "Batch $batch failed (rate limit or network error) — stopping"
              break
            }
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All financials batches complete."
              break
            fi
            sleep 65
          done
