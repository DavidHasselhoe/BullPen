name: Cron — Prefetch Market Data

# Daily at 05:00 UTC. Pre-caches stats + earnings for all S&P 500 + NASDAQ 100
# tickers (market_data_cache + screener_stats).
#
# Stats+earnings are paced one batch (5 symbols, ~350 credits) every 75s —
# ~121 batches × 75s ≈ 2h30m total — to keep this cron's *sustained* usage
# around ~280 credits/min, well under TwelveData's 610/min plan cap, so live
# user traffic always has headroom during the run instead of getting starved
# by a burst.
#
# Financials used to run as a second step in this same job. It now has its own
# workflow (cron-prefetch-financials.yml) because its universe grew from
# ~530 SIGNIFICANT_TICKERS to the full tier-1 screener universe (~1,200+
# tickers): at one symbol per 65s the two phases together no longer fit inside
# GitHub's 360-minute per-job ceiling. Splitting them also means a slow stats
# phase can't eat the financials phase's runtime.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  prefetch:
    runs-on: ubuntu-latest
    # A clean run takes ~2h58m (11-11), so 180 left no room for retries.
    timeout-minutes: 240
    steps:
      - name: Refresh stats + earnings (paced batches)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpeninvest.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          echo "Starting stats+earnings prefetch…"
          # One failed request used to end the run as "success", leaving the
          # rest of the universe uncached with nothing failing (same bug the
          # screener jobs had, fixed 2026-11-17). Retry twice, then skip the
          # batch; stop only after 3 skipped in a row; any skip fails the job.
          SKIPPED=0; MISSES=0
          for batch in $(seq 0 120); do
            echo "→ Batch $batch"
            RESPONSE=""
            for attempt in 1 2 3; do
              RESPONSE=$(curl -fsS --max-time 150 -X GET -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/prefetch-market-data?phase=stats&batch=${batch}") && break
              RESPONSE=""
              echo "Batch $batch attempt $attempt failed"
              if [ $attempt -lt 3 ]; then sleep 75; fi
            done
            if [ -z "$RESPONSE" ]; then
              SKIPPED=$((SKIPPED + 1)); MISSES=$((MISSES + 1))
              echo "::warning::Batch $batch skipped after 3 attempts"
              if [ $MISSES -ge 3 ]; then
                echo "::error::3 batches in a row failed, stopping at batch $batch"
                exit 1
              fi
              continue
            fi
            MISSES=0
            echo "$RESPONSE"
            DONE=$(echo "$RESPONSE" | jq -r '.done // false')
            if [ "$DONE" = "true" ]; then
              echo "All stats batches complete."
              break
            fi
            sleep 75
          done
          if [ $SKIPPED -gt 0 ]; then
            echo "::error::$SKIPPED batch(es) skipped after retries"
            exit 1
          fi
