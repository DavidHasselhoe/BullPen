name: Cron — Instagram Earnings Publish

# Monday 11:00 UTC = 7:00 AM ET during EDT (drifts to 6:00 AM ET once EST
# starts in Nov, same as every other UTC-fixed cron in this repo — GitHub
# Actions crons don't follow DST). Publishes whatever cron-instagram-earnings
# staged the previous morning (Sunday 12:00 UTC), so there's about a day
# between "ready for review" and "actually live" — see the route handler's
# own docstring for what happens if nothing was staged or it already published.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:  # allows manual fire from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/instagram-earnings-publish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bullpen.no' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not configured in repo settings"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/instagram-earnings-publish"
